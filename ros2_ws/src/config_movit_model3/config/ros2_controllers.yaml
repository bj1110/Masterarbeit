# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - model1_right_shoulder_rotation_joint
      - model1_right_shoulder_abduction_joint
      - model1_right_shoulder_flexion_joint
      - model1_right_elbow_flexion_joint
      - model1_right_elbow_rotation_joint
      - model1_right_wrist_flexion_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true